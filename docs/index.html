<!doctype html>
<html lang="en" class="booting">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <link rel="apple-touch-icon" href="pwa-512x512.png" />
    <title>MozPong</title>
    <meta name="theme-color" content="#000000" />
    <!-- iOS Safari: prevent pinch-zoom (viewport meta is ignored since iOS 10) -->
    <script>
      (function () {
        function preventZoom(e) {
          e.preventDefault();
        }
        document.addEventListener('gesturestart', preventZoom, {
          passive: false,
        });
        document.addEventListener('gesturechange', preventZoom, {
          passive: false,
        });
        document.addEventListener('gestureend', preventZoom, {
          passive: false,
        });
      })();
    </script>
    <link rel="icon" href="favicon.png" type="image/png" />
    <style>
      /* Critical boot styles: show only the loading screen before the app CSS
         and JS are ready. */
      html.booting body > *:not(#loading) {
        display: none !important;
      }
      html.booting,
      html.booting body {
        background: #ffffff;
      }
      html.booting #loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        z-index: 9999;
      }
      html.booting .load-panel {
        width: min(512px, 90vw);
        padding: 10px 12px 12px;
        background: #ffffff;
        border: 3px solid #000000;
        box-sizing: border-box;
      }
      html.booting .load-panel img {
        display: block;
        width: 100%;
        height: auto;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      html.booting .load-label {
        margin: 4px 0 3px;
        color: #000000;
        font-family: Geneva, "Helvetica Neue", Arial, sans-serif;
        font-size: 14px;
      }
      html.booting .load-track {
        height: 13px;
        padding: 1px;
        border: 1px solid #000000;
        background: #ffffff;
        box-sizing: border-box;
      }
      html.booting #load-fill {
        width: 0%;
        height: 100%;
        background: repeating-linear-gradient(45deg, #000 0 2px, #fff 2px 4px);
      }
    </style>
    <script type="module" crossorigin src="./assets/index-GXt_AZcr.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-dVFuTfPh.css">
  <link rel="manifest" href="./manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="./registerSW.js"></script></head>
  <body>
    <div class="main-container">
      <div class="game-wrapper">
        <div id="screen-wrap">
          <canvas id="game" width="512" height="400"></canvas>
          <div id="overlay"></div>
        </div>
      </div>
    </div>

    <div class="mobile-controls" id="mobileControls">
      <div class="mobile-controls-inner">
        <button type="button" id="mobilePause" class="mobile-btn mobile-btn-text">
          New Game
        </button>
        <button type="button" id="mobileMenu" class="mobile-btn mobile-btn-text">
          Menu
        </button>
      </div>
      <div id="deadArea"></div>
    </div>

    <div class="side-panel-wrapper" id="sidePanelWrapper">
      <div class="side-panel">
        <div class="controls-row">
          <button id="menu-new" class="game-btn primary">New Game</button>
          <button id="menu-pause" class="game-btn" disabled>Pause</button>
        </div>
        <div class="controls-row">
          <button id="menu-sound" class="game-btn">Sound: On</button>
          <button id="menu-music" class="game-btn">BGM: On</button>
          <button id="menu-stage" class="game-btn">Select Stage</button>
        </div>
        <div class="controls-row">
          <div class="controls-help">
            <span>Controls:</span>
            <table>
              <tr>
                <td><kbd>Mouse</kbd></td>
                <td>Move MozMoz</td>
              </tr>
              <tr>
                <td><kbd>Click</kbd></td>
                <td>Launch Butasan</td>
              </tr>
              <tr>
                <td><kbd>S</kbd> / <kbd>M</kbd></td>
                <td>Sound / BGM</td>
              </tr>
              <tr>
                <td><kbd>P</kbd></td>
                <td>Pause</td>
              </tr>
              <tr>
                <td><kbd>Enter</kbd></td>
                <td>Start / Resume</td>
              </tr>
            </table>
          </div>
        </div>
        <div class="footer">
          <a href="https://github.com/Yqnn/mozpong-web-port" target="_blank">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
              <path
                d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"
              />
            </svg>
            GitHub
          </a>
          <a href="https://github.com/sponsors/Yqnn" target="_blank">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 16 13.92"
              class="sponsor"
            >
              <path
                d="M8 13.24C4.45 11.3.75 8 .75 4.5.75 2.2 2.55.75 4.25.75 6 .75 7.5 2 8 3.75c.5-1.75 2-3 3.75-3 1.7 0 3.5 1.45 3.5 3.75 0 3.5-3.7 6.8-7.25 8.74z"
                fill="none"

      </div>
    </div>

    <div id="loading">
      <div class="load-panel">
        <img src="assets/loading.png" alt="MozPong" />
        <div class="load-label">Initializing...</div>
        <div class="load-track"><div id="load-fill"></div></div>
      </div>
    </div>

  </body>
</html>
